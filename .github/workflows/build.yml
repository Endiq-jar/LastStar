name: Build LastStar

# Native Godot 4.3 pipeline (no web wrapper, no Capacitor):
#   * verify   – imports the project and boots the main scene headlessly
#   * android  – exports a real APK with the official export templates and the
#                Android SDK/NDK, then publishes it to the rolling `latest-apk`
#                release so there is always one stable download URL
#   * desktop  – Linux + Windows builds
#   * release  – attaches everything to `v*` tag releases
#
# Optional Android release signing secrets:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_USER / ANDROID_KEYSTORE_PASSWORD
# Without them a signed *debug* APK is produced (installs on any phone).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_VERSION_DIR: "4.3.stable"
  GODOT_RELEASE: "4.3-stable"
  EXPORT_NAME: "LastStar"

jobs:
  verify:
    name: Import + headless boot
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-editor-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot editor
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            curl -L --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            mkdir -p /opt/godot
            unzip -q -o /tmp/godot.zip -d /opt/godot
            mv /opt/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi
          /opt/godot/godot --version

      - name: Android preset sanity
        run: |
          set -uo pipefail
          grep -q "import_etc2_astc=true" project.godot \
            && echo "::notice::ETC2/ASTC import enabled (required for Android export)." \
            || echo "::error::project.godot must set textures/vram_compression/import_etc2_astc=true"
          grep -q "texture_format/etc2_astc=true" export_presets.cfg \
            && echo "::notice::Android preset requests ETC2/ASTC textures." \
            || echo "::error::export_presets.cfg texture_format/etc2_astc must be true"

      - name: Import project + boot main scene headlessly
        run: |
          set -uo pipefail
          /opt/godot/godot --headless --editor --quit-after 400 > /tmp/import.log 2>&1 || { echo "::error::Project import failed"; tail -60 /tmp/import.log; exit 1; }
          test -d .godot
          /opt/godot/godot --headless --path . --quit-after 240 > /tmp/boot.log 2>&1 || true
          tail -40 /tmp/boot.log || true
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/boot.log; then
            # Surface each offending line as an annotation so the failure is
            # readable without downloading raw job logs.
            grep -E "SCRIPT ERROR|Parse Error|res://.*\.gd:[0-9]+" /tmp/boot.log | head -8 | while IFS= read -r line; do
              echo "::error title=GDScript::$line"
            done
            echo "::error::GDScript errors detected while booting the world"
            exit 1
          fi
          echo "World booted without GDScript errors."

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + export templates
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            /opt/godot-templates
          key: godot-${GODOT_RELEASE}-linux-android

      - name: Install Godot 4.3 + Android export templates
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            curl -L --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            mkdir -p /opt/godot && unzip -q -o /tmp/godot.zip -d /opt/godot
            mv /opt/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi
          if [ ! -f /opt/godot-templates/android_source.zip ]; then
            curl -L --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q /tmp/templates.tpz -d /tmp/tpl
            mkdir -p /opt/godot-templates
            cp -r /tmp/tpl/templates/. /opt/godot-templates/
          fi
          ls /opt/godot-templates | head -8
          /opt/godot/godot --version

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -n1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "cmake;3.22.1" "ndk;23.2.8568313" | tail -5

      - name: Configure Godot editor settings (SDK, JDK, debug keystore)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn /opt/godot-templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > "$SETTINGS"
          cat "$SETTINGS"

      - name: Detect release keystore
        id: signing
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEY_B64:-}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release keystore found - building a signed release APK."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - building a signed debug APK."
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.release == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEY_B64" | base64 -d > "$HOME/laststar.keystore"
          chmod 600 "$HOME/laststar.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/laststar.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_KEYSTORE_USER }}"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Import project
        run: |
          set -euo pipefail
          /opt/godot/godot --headless --editor --quit-after 400
          test -d .godot

      - name: Environment diagnostics
        run: |
          set -uo pipefail
          echo "::group::toolchain"
          java -version 2>&1 | head -2
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "::endgroup::"
          echo "::group::android sdk"
          ls "${ANDROID_SDK_ROOT}" 2>/dev/null || true
          ls "${ANDROID_SDK_ROOT}/platform-tools/adb" 2>/dev/null || echo "NO ADB"
          ls "${ANDROID_SDK_ROOT}/build-tools" 2>/dev/null || echo "NO BUILD TOOLS"
          ls "${ANDROID_SDK_ROOT}/ndk" 2>/dev/null || echo "NO NDK"
          echo "::endgroup::"
          echo "::group::godot templates"
          ls /opt/godot-templates | grep -iE "android|linux|version" || echo "NO ANDROID TEMPLATES"
          echo "::endgroup::"
          echo "::group::editor settings"
          cat "$HOME/.config/godot/editor_settings-4.3.tres" 2>/dev/null || echo "NO SETTINGS FILE"
          echo "::endgroup::"
          echo "::group::preset"
          sed -n '/\[preset.0/,/permissions/p' export_presets.cfg
          echo "::endgroup::"
          # Annotate key facts so they're readable without raw logs.
          echo "::notice title=Java::$(java -version 2>&1 | head -1)"
          echo "::notice title=Build tools::$(ls ${ANDROID_SDK_ROOT}/build-tools 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=Templates::$(ls /opt/godot-templates 2>/dev/null | grep -c . ) files; android=$(ls /opt/godot-templates 2>/dev/null | grep -ci android)"

      - name: Reproduce Android export validation
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          JAVA="${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          fail=0
          for check in "$SDK/platform-tools/adb" "$JAVA/bin/java" \
                       "$SDK/build-tools/34.0.0/apksigner" "$HOME/debug.keystore" \
                       "/opt/godot-templates/android_debug.apk" "/opt/godot-templates/android_release.apk"; do
            if [ -e "$check" ]; then echo "::notice title=OK::$check"; else echo "::error title=MISSING::$check"; fail=1; fi
          done
          ls "$SDK/ndk" 2>/dev/null || echo "::warning title=NDK::ndk folder missing"
          [ -d "$HOME/.config/godot" ] && ls "$HOME/.config/godot" | head
          cat "$HOME/.config/godot/editor_settings-4.3.tres" 2>/dev/null | while IFS= read -r l; do echo "::notice title=settings::$l"; done
          exit 0

      - name: Export APK (gradle build)
        id: gradle
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p build/android
          OUT="build/android/${EXPORT_NAME}.apk"
          MODE="debug"
          [ "${{ steps.signing.outputs.release }}" = "true" ] && MODE="release"
          echo "Exporting $MODE APK (gradle)"
          set +e
          /opt/godot/godot --headless --verbose --install-android-build-template \
            --export-${MODE} "Android" "$OUT" > /tmp/export.log 2>&1
          CODE=$?
          set -e
          # Job logs live on storage we may not be able to read from outside,
          # so echo the interesting lines as annotations directly.
          # Print the full "configuration errors" block (Godot lists each
          # problem on its own line right after the header).
          # Annotate every reason line: Godot prints one per problem.
          awk '/due to configuration errors/{f=1;next} /Project export for preset|^---/{f=0} f' /tmp/export.log | head -20 | while IFS= read -r line; do
            echo "::error title=Godot config::${line}"
          done
          # Also annotate the raw export.log so the reason is always readable.
          # The reason lines follow the header; annotate that window + the tail.
          IDX=$(grep -n "due to configuration errors" /tmp/export.log | cut -d: -f1 | head -1)
          if [ -n "$IDX" ]; then
            sed -n "${IDX},$((IDX+16))p" /tmp/export.log | while IFS= read -r line; do
              echo "::error title=reason::${line}"
            done
          fi
          tail -25 /tmp/export.log | while IFS= read -r line; do
            echo "::error title=export.log::${line}"
          done
          grep -nE "ERROR|FAILURE|What went wrong|Caused by|error:|Exception|BUILD FAILED" /tmp/export.log \
            | head -20 | while IFS= read -r line; do echo "::warning title=Android export::$line"; done
          tail -20 /tmp/export.log || true
          if [ -f "$OUT" ] && [ "$CODE" -eq 0 ]; then
            echo "gradle-export ok"
            exit 0
          fi
          echo "::warning::Gradle-based Android export failed (exit $CODE) - trying the fallback."
          exit 1

      - name: Export APK (prebuilt template fallback)
        if: steps.gradle.outcome == 'failure'
        run: |
          set -euo pipefail
          # Gradle needs a full SDK/NDK toolchain. If that path is unhappy on
          # the runner we still ship an APK by exporting into the prebuilt
          # android_debug.apk template that comes with export_templates.tpz.
          sed -i 's|^gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg
          OUT="build/android/${EXPORT_NAME}.apk"
          MODE="debug"
          [ "${{ steps.signing.outputs.release }}" = "true" ] && MODE="release"
          set +e
          /opt/godot/godot --headless --verbose --export-${MODE} "Android" "$OUT" > /tmp/export2.log 2>&1
          CODE=$?
          set -e
          awk '/due to configuration errors/{f=1;next} /Project export for preset|^---/{f=0} f' /tmp/export2.log | head -20 | while IFS= read -r line; do
            echo "::error title=Godot config (fallback)::${line}"
          done
          IDX2=$(grep -n "due to configuration errors" /tmp/export2.log | cut -d: -f1 | head -1)
          if [ -n "$IDX2" ]; then
            sed -n "${IDX2},$((IDX2+16))p" /tmp/export2.log | while IFS= read -r line; do
              echo "::error title=reason (fallback)::${line}"
            done
          fi
          tail -25 /tmp/export2.log | while IFS= read -r line; do
            echo "::error title=export2.log::${line}"
          done
          grep -nE "ERROR|FAILURE|error:" /tmp/export2.log | head -20 | while IFS= read -r line; do echo "::error title=Android fallback::$line"; done
          tail -20 /tmp/export2.log || true
          test -f "$OUT" || { echo "::error::Fallback export produced no APK (exit $CODE)"; exit 1; }
          echo "::notice::Fallback (prebuilt template) export succeeded."

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-log
          path: |
            /tmp/export.log
            /tmp/export2.log
          if-no-files-found: ignore

      - name: Publish export diagnostics as an issue comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BODY=/tmp/diag.md
          {
            echo "### Android export diagnostics"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| gradle export | ${{ steps.gradle.outcome }} |"
            echo
            echo '```'
            echo "=== export.log (tail 120) ==="
            tail -120 /tmp/export.log 2>/dev/null || echo "(missing)"
            echo
            echo "=== export2.log (tail 60) ==="
            tail -60 /tmp/export2.log 2>/dev/null || echo "(missing)"
            echo
            echo "=== APK ==="
            ls -l build/android 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "_run ${{ github.run_id }} attempt ${{ github.run_attempt }}, commit ${GITHUB_SHA::7}_"
          } > "$BODY"
          if [ -z "${GH_REPORT_ISSUE:-}" ]; then
            NUM=$(gh issue list --state open --search "CI diagnostics in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -z "$NUM" ]; then
              NUM=$(gh issue create --title "CI diagnostics (auto)" --body "Automated log mirror for the Android build. Safe to ignore." 2>/dev/null | grep -oE 'issues/[0-9]+' | grep -oE '[0-9]+' || true)
            fi
          else
            NUM="$GH_REPORT_ISSUE"
          fi
          if [ -n "${NUM:-}" ]; then
            gh issue comment "$NUM" --body-file "$BODY" || echo "::warning::could not comment on issue $NUM"
          else
            echo "::warning::no diagnostics issue available"
          fi

      - name: Confirm APK exists
        run: |
          set -euo pipefail
          OUT="build/android/${EXPORT_NAME}.apk"
          test -f "$OUT" || { echo "::error::No APK produced"; exit 1; }
          ls -lh build/android

      - name: Verify APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          "$SDK/build-tools/34.0.0/aapt2" dump badging build/android/${EXPORT_NAME}.apk \
            | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastStar-android
          path: build/android/LastStar.apk
          if-no-files-found: error

      - name: Publish to rolling `latest-apk` release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-apk"
          NOTES="**LastStar — latest native Android build** (commit \`${GITHUB_SHA::7}\`, $(date -u +%H:%M UTC)).

          Built with **Godot 4.3** and exported as a native APK (arm64-v8a) — this is a
          real game app, not a web page in a shell.

          **Install:** download \`LastStar.apk\` on your Android phone (Android 7.0+),
          allow "install unknown apps" for your file manager, open it and play.

          Landscape · offline · touch joystick + buttons, or keyboard/mouse on desktop."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "LastStar — latest Android build" --notes "$NOTES"
          fi
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$asset" --yes || true
          done
          gh release upload "$TAG" "build/android/${EXPORT_NAME}.apk" --clobber
          gh release edit "$TAG" --notes "$NOTES"

  desktop:
    name: Linux + Windows
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            /opt/godot-templates
          key: godot-${GODOT_RELEASE}-linux-desktop

      - name: Install Godot 4.3 + export templates
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            curl -L --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            mkdir -p /opt/godot && unzip -q -o /tmp/godot.zip -d /opt/godot
            mv /opt/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi
          if [ ! -f /opt/godot-templates/linux_release.x86_64 ]; then
            curl -L --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q /tmp/templates.tpz -d /tmp/tpl
            mkdir -p /opt/godot-templates
            cp -r /tmp/tpl/templates/. /opt/godot-templates/
          fi
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn /opt/godot-templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"

      - name: Import project
        run: |
          set -euo pipefail
          /opt/godot/godot --headless --editor --quit-after 400
          test -d .godot

      - name: Export Linux + Windows
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows
          /opt/godot/godot --headless --verbose --export-release "Linux" "build/linux/${EXPORT_NAME}.x86_64"
          /opt/godot/godot --headless --verbose --export-release "Windows Desktop" "build/windows/${EXPORT_NAME}.exe"
          chmod +x build/linux/${EXPORT_NAME}.x86_64
          ls -lh build/linux build/windows

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: LastStar-desktop
          path: |
            build/linux/**
            build/windows/**
          if-no-files-found: error

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "LastStar ${{ github.ref_name }}"
          body: |
            **LastStar** — an open-world, cel-shaded action-RPG inspired by
            Genshin Impact, built with Godot 4.3.

            * `LastStar.apk` — native Android build (arm64-v8a).
            * `linux/` — Linux x86_64 desktop build.
            * `windows/` — Windows x86_64 desktop build.
          files: |
            dist/LastStar-android/LastStar.apk
            dist/LastStar-desktop/**
          draft: false
          prerelease: false
