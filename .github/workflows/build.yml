name: Build LastStar

# Native Godot 4.3 pipeline (no web wrapper, no Capacitor):
#   * verify   – imports the project and boots the main scene headlessly
#   * android  – exports a real APK with the official export templates and the
#                Android SDK/NDK, then publishes it to the rolling `latest-apk`
#                release so there is always one stable download URL
#   * desktop  – Linux + Windows builds
#   * release  – attaches everything to `v*` tag releases
#
# Optional Android release signing secrets:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_USER / ANDROID_KEYSTORE_PASSWORD
# Without them a signed *debug* APK is produced (installs on any phone).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_VERSION_DIR: "4.3.stable"
  GODOT_RELEASE: "4.3-stable"
  EXPORT_NAME: "LastStar"

jobs:
  verify:
    name: Import + headless boot
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-editor-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot editor
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            curl -L --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            mkdir -p /opt/godot
            unzip -q -o /tmp/godot.zip -d /opt/godot
            mv /opt/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi
          /opt/godot/godot --version

      - name: Android preset sanity
        run: |
          set -uo pipefail
          grep -q "import_etc2_astc=true" project.godot \
            && echo "::notice::ETC2/ASTC import enabled (required for Android export)." \
            || echo "::error::project.godot must set textures/vram_compression/import_etc2_astc=true"
          grep -q "texture_format/etc2_astc=true" export_presets.cfg \
            && echo "::notice::Android preset requests ETC2/ASTC textures." \
            || echo "::error::export_presets.cfg texture_format/etc2_astc must be true"

      - name: Import project + boot main scene headlessly
        run: |
          set -uo pipefail
          /opt/godot/godot --headless --editor --quit-after 400 > /tmp/import.log 2>&1 || { echo "::error::Project import failed"; tail -60 /tmp/import.log; exit 1; }
          test -d .godot
          /opt/godot/godot --headless --path . --quit-after 240 > /tmp/boot.log 2>&1 || true
          tail -40 /tmp/boot.log || true
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/boot.log; then
            # Surface each offending line as an annotation so the failure is
            # readable without downloading raw job logs.
            grep -E "SCRIPT ERROR|Parse Error|res://.*\.gd:[0-9]+" /tmp/boot.log | head -8 | while IFS= read -r line; do
              echo "::error title=GDScript::$line"
            done
            echo "::error::GDScript errors detected while booting the world"
            exit 1
          fi
          echo "World booted without GDScript errors."

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [verify]
    container:
      # Ships Godot 4.3, the matching export templates, Android SDK 33 +
      # build-tools 33.0.2, NDK 25.2 and a pre-generated debug keystore, all wired
      # into editor_settings-4.3.tres. This is the reference Android toolchain.
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Wire up the image toolchain
        run: |
          set -uo pipefail
          echo "user=$(id -un) home=$HOME"
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ] \
             && [ "$HOME/.local/share/godot/export_templates/4.3.stable" != "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -a "/root/.local/share/godot/export_templates/4.3.stable" "$HOME/.local/share/godot/export_templates/" || true
          fi
          if [ -f /root/.config/godot/editor_settings-4.3.tres ] \
             && [ ! -s "$HOME/.config/godot/editor_settings-4.3.tres" ]; then
            cp -a /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/" || true
          fi
          echo "--- templates ---"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable" 2>/dev/null | grep -i android || echo "::error::android templates missing"
          echo "--- editor settings ---"
          cat "$HOME/.config/godot/editor_settings-4.3.tres" 2>/dev/null || echo "::error::editor settings missing"
          echo "--- env ---"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} JAVA_HOME=${JAVA_HOME:-unset}"
          echo "--- versions ---"
          godot --version || true
          java -version 2>&1 | head -1 || true
          ls "${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}/build-tools" 2>/dev/null || true
          ls "${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}/platforms" 2>/dev/null || true

      - name: Detect release keystore
        id: signing
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEY_B64:-}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release keystore found - signed release APK."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - signed debug APK."
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.release == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEY_B64" | base64 -d > "$HOME/laststar.keystore"
          chmod 600 "$HOME/laststar.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/laststar.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_KEYSTORE_USER }}"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Import project
        run: |
          set -euo pipefail
          godot --headless --editor --quit-after 400
          test -d .godot

      - name: Export APK
        run: |
          set -uo pipefail
          mkdir -p build/android
          OUT="build/android/${EXPORT_NAME}.apk"
          MODE="debug"
          [ "${{ steps.signing.outputs.release }}" = "true" ] && MODE="release"
          set +e
          godot --headless --verbose --install-android-build-template \
            --export-${MODE} "Android" "$OUT" > /tmp/export.log 2>&1
          CODE=$?
          set -e
          IDX=$(grep -n "due to configuration errors" /tmp/export.log | cut -d: -f1 | head -1)
          if [ -n "$IDX" ]; then
            sed -n "${IDX},$((IDX+16))p" /tmp/export.log | while IFS= read -r line; do
              echo "::error title=reason::${line}"
            done
          fi
          grep -nE "BUILD FAILED|What went wrong|Could not|FAILURE:" /tmp/export.log | head -12 | while IFS= read -r line; do
            echo "::error title=gradle::${line}"
          done
          tail -25 /tmp/export.log | while IFS= read -r line; do echo "::warning title=log::${line}"; done
          if [ ! -f "$OUT" ] || [ "$CODE" -ne 0 ]; then
            echo "::error::APK export failed (exit $CODE)."
            exit 1
          fi
          ls -lh build/android

      - name: Verify APK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          AAPT="$(find "$SDK/build-tools" -name aapt2 2>/dev/null | head -1)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging build/android/${EXPORT_NAME}.apk 2>/dev/null \
              | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" \
              | while IFS= read -r line; do echo "::notice title=APK::${line}"; done || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastStar-android
          path: build/android/LastStar.apk
          if-no-files-found: error

      - name: Publish to rolling `latest-apk` release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-apk"
          NOTES="**LastStar — latest native Android build** (commit \`${GITHUB_SHA::7}\`, $(date -u +%H:%M UTC)).

          Built with **Godot 4.3** and exported as a native APK (arm64-v8a) — a real
          game app, not a web page in a shell.

          **Install:** download \`LastStar.apk\` on an Android phone (Android 7.0+),
          allow \"install unknown apps\" for your file manager, open it and play.

          Landscape · offline · touch joystick + buttons, or keyboard/mouse on desktop."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "LastStar — latest Android build" --notes "$NOTES"
          fi
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$asset" --yes || true
          done
          gh release upload "$TAG" "build/android/${EXPORT_NAME}.apk" --clobber
          gh release edit "$TAG" --notes "$NOTES"

  desktop:
    name: Linux + Windows
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            /opt/godot-templates
          key: godot-${GODOT_RELEASE}-linux-desktop

      - name: Install Godot 4.3 + export templates
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            curl -L --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            mkdir -p /opt/godot && unzip -q -o /tmp/godot.zip -d /opt/godot
            mv /opt/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi
          if [ ! -f /opt/godot-templates/linux_release.x86_64 ]; then
            curl -L --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q /tmp/templates.tpz -d /tmp/tpl
            mkdir -p /opt/godot-templates
            cp -r /tmp/tpl/templates/. /opt/godot-templates/
          fi
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn /opt/godot-templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"

      - name: Import project
        run: |
          set -euo pipefail
          /opt/godot/godot --headless --editor --quit-after 400
          test -d .godot

      - name: Export Linux + Windows
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows
          /opt/godot/godot --headless --verbose --export-release "Linux" "build/linux/${EXPORT_NAME}.x86_64"
          /opt/godot/godot --headless --verbose --export-release "Windows Desktop" "build/windows/${EXPORT_NAME}.exe"
          chmod +x build/linux/${EXPORT_NAME}.x86_64
          ls -lh build/linux build/windows

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: LastStar-desktop
          path: |
            build/linux/**
            build/windows/**
          if-no-files-found: error

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "LastStar ${{ github.ref_name }}"
          body: |
            **LastStar** — an open-world, cel-shaded action-RPG inspired by
            Genshin Impact, built with Godot 4.3.

            * `LastStar.apk` — native Android build (arm64-v8a).
            * `linux/` — Linux x86_64 desktop build.
            * `windows/` — Windows x86_64 desktop build.
          files: |
            dist/LastStar-android/LastStar.apk
            dist/LastStar-desktop/**
          draft: false
          prerelease: false
